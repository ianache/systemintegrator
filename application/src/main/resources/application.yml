server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: integration
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/integration?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:integration}
    password: ${SPRING_DATASOURCE_PASSWORD:integration}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
        time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:integration-consumer-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jackson:
    time-zone: UTC

logging:
  level:
    root: INFO
    com.cl2.integration.adapter.out.http.HttpOutboundClient: DEBUG
    com.cl2.integration.adapter.out.generic.security.OAuth2TokenCacheManager: DEBUG
    com.cl2.integration.integration.outbound: DEBUG

integration:
  security:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://localhost:8200}
      token: ${VAULT_TOKEN:root}
      cache-ttl-seconds: ${VAULT_CACHE_TTL_SECONDS:600}
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 1000
      batch-size: 50
      max-attempts: 5
      initial-backoff-ms: 1000
  inbox:
    topic-pattern: ${INTEGRATION_INBOX_TOPIC_PATTERN:integration\..*\.events}
    topics: ${INTEGRATION_INBOX_TOPICS:integration.events}
    listener:
      auto-startup: ${INTEGRATION_INBOX_LISTENER_AUTO_STARTUP:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: systemintegrator-app
    distribution:
      percentiles-histogram:
        integration.outbound.http.duration: true
        integration.sync.duration: true
        integration.transformation.duration: true

---
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: qa-e2e

integration:
  qa:
    enabled: true
    keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI:}
