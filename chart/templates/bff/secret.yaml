{{- if and .Values.bff.enabled (not .Values.bff.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "systemintegrator.fullname" (dict "root" $ "component" "bff") }}
  labels:
    {{- include "systemintegrator.componentLabels" (dict "root" $ "component" "bff") | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ .Values.bff.oidc.clientSecret | quote }}
  sessionSecret: {{ .Values.bff.sessionSecret | quote }}
{{- end }}
