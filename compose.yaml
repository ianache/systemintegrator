services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: integration
      MYSQL_USER: integration
      MYSQL_PASSWORD: integration
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
