services:
  mysql:
    image: mysql:8.4
    container_name: integration-mysql
    hostname: integration-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-integration}
      MYSQL_USER: ${MYSQL_USER:-integration}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-integration}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-integration-root}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      integration-internal:
        aliases:
          - integration-mysql
          - mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4
    container_name: integration-redis
    hostname: integration-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      integration-internal:
        aliases:
          - integration-redis
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  vault:
    image: hashicorp/vault:1.18
    container_name: integration-vault
    hostname: integration-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    command: server -dev
    cap_add:
      - IPC_LOCK
    ports:
      - "${VAULT_PORT:-8200}:8200"
    networks:
      integration-internal:
        aliases:
          - integration-vault
          - vault
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.18
    container_name: integration-vault-init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      SAP_HANA_USERNAME: ${SAP_HANA_USERNAME:-SIGO}
      SAP_HANA_PASSWORD: ${SAP_HANA_PASSWORD:-CHANGEME}
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      'until vault status >/dev/null 2>&1; do sleep 1; done;
      vault kv put secret/sap/sigo-hana-credentials
      username="$${SAP_HANA_USERNAME}"
      password="$${SAP_HANA_PASSWORD}"'
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - integration-internal

  kafka:
    image: apache/kafka:3.8.1
    container_name: integration-kafka
    hostname: integration-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@integration-kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://integration-kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      integration-internal:
        aliases:
          - integration-kafka
          - kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integration-app
    hostname: integration-app
    environment:
      SPRING_PROFILES_ACTIVE: compose
      SPRING_DATASOURCE_URL: jdbc:mysql://integration-mysql:3306/${MYSQL_DATABASE:-integration}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-integration}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-integration}
      SPRING_DATA_REDIS_HOST: integration-redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: integration-kafka:9092
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://integration-vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      integration-internal:
        aliases:
          - integration-app
          - app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Tenant-ID: 00000000-0000-0000-0000-000000000000' 'http://localhost:8080/api/v1/integration-profiles?activeOnly=true' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  middleware:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: integration-middleware
    hostname: integration-middleware
    environment:
      APP_URI: http://integration-app:8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-}
    ports:
      - "${GATEWAY_PORT:-8081}:8081"
    depends_on:
      app:
        condition: service_healthy
    networks:
      integration-internal:
        aliases:
          - integration-middleware
          - middleware
      gateway-public:
        aliases:
          - integration-middleware
          - middleware
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  kafka-data:

networks:
  integration-internal:
  gateway-public:
