spring:
  datasource:
    url: jdbc:mysql://localhost:3306/integration?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: integration
    password: integration
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: localhost:29092
    admin:
      fail-fast: false
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

integration-profile:
  events: integration-profile.events
