server:
  port: ${GATEWAY_PORT:8081}
spring:
  application:
    name: integration-gateway
  cloud:
    gateway:
      routes:
        - id: integration-api
          uri: ${APP_URI:http://localhost:8080}
          predicates:
            - Path=/api/**
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:}
management:
  endpoints:
    web:
      exposure:
        include: health
