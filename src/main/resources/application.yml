server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: integration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/integration?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:integration}
    password: ${DB_PASSWORD:integration}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
